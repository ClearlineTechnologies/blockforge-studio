name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore pinned compiler and SDKs
        shell: pwsh
        run: ./scripts/setup-toolchain.ps1
      - run: npm run build
      - run: npm test
      - run: npm run launcher
      - name: Browser workflows
        shell: pwsh
        run: ./scripts/test-browser.ps1
